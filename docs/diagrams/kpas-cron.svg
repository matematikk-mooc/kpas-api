<svg xmlns="http://www.w3.org/2000/svg" width="724" height="116" viewBox="0 0 724 116">
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #1E293B; }
      .sublabel { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 500; fill: #64748B; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; rx: 6px; }
      .edge { stroke: #0078D4; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { fill: #0078D4; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" class="arrow" />
    </marker>
  </defs>

  <!-- Pure White Background -->
  <rect width="724" height="116" fill="#FFFFFF"/>

  <!-- ==================== CONNECTORS ==================== -->

  <!-- Scheduler -> fetch_from:nsr (Top) -->
  <path d="M 144 48 L 166 48 L 166 26 L 188 26" class="edge" marker-end="url(#arr)"/>

  <!-- Scheduler -> fetch_from:canvas (Bottom) -->
  <path d="M 144 68 L 166 68 L 166 90 L 188 90" class="edge" marker-end="url(#arr)"/>

  <!-- fetch_from:nsr -> NSR & NBR APIs -->
  <path d="M 352 26 L 376 26" class="edge" marker-end="url(#arr)"/>

  <!-- fetch_from:canvas -> Canvas API -->
  <path d="M 352 90 L 376 90" class="edge" marker-end="url(#arr)"/>

  <!-- NSR & NBR APIs -> Azure MySQL (Merge Top) -->
  <path d="M 536 26 L 558 26 L 558 48 L 580 48" class="edge" marker-end="url(#arr)"/>

  <!-- Canvas API -> Azure MySQL (Merge Bottom) -->
  <path d="M 536 90 L 558 90 L 558 68 L 580 68" class="edge" marker-end="url(#arr)"/>

  <!-- ==================== COMPONENTS ==================== -->

  <!-- 1. Laravel Scheduler -->
  <g transform="translate(4, 36)">
    <rect width="140" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#F59E0B" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
    <text x="38" y="22" class="label">Scheduler</text>
    <text x="38" y="34" class="sublabel">schedule:work</text>
  </g>

  <!-- 2a. fetch_from:nsr -->
  <g transform="translate(188, 4)">
    <rect width="164" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#0284C7" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-9 13H5v-2h6v2zm-2.3-5L5 8.7l1.4-1.4L10.1 11l-3.7 3.7L5 13.3l3.7-1.3z"/></svg>
    <text x="38" y="22" class="label">fetch_from:nsr</text>
    <text x="38" y="34" class="sublabel">Daily at 01:00</text>
  </g>

  <!-- 2b. fetch_from:canvas -->
  <g transform="translate(188, 68)">
    <rect width="164" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#0284C7" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-9 13H5v-2h6v2zm-2.3-5L5 8.7l1.4-1.4L10.1 11l-3.7 3.7L5 13.3l3.7-1.3z"/></svg>
    <text x="38" y="22" class="label">fetch_from:canvas</text>
    <text x="38" y="34" class="sublabel">Daily at 02:00</text>
  </g>

  <!-- 3a. NSR & NBR APIs -->
  <g transform="translate(376, 4)">
    <rect width="160" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#10B981" d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/></svg>
    <text x="38" y="22" class="label">NSR &amp; NBR APIs</text>
    <text x="38" y="34" class="sublabel">data-nsr.udir.no</text>
  </g>

  <!-- 3b. Canvas API -->
  <g transform="translate(376, 68)">
    <rect width="160" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#E11D48" d="M12 2L1 21h22L12 2zm0 3.8L19.5 19h-15L12 5.8z"/></svg>
    <text x="38" y="22" class="label">Canvas API</text>
    <text x="38" y="34" class="sublabel">bibsys.instructure.com</text>
  </g>

  <!-- 4. Azure MySQL -->
  <g transform="translate(580, 36)">
    <rect width="140" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#0078D4" d="M12 3C7.58 3 4 4.79 4 7v10c0 2.21 3.59 4 8 4s8-1.79 8-4V7c0-2.21-3.58-4-8-4zm0 2c3.87 0 6 1.5 6 2s-2.13 2-6 2-6-1.5-6-2 2.13-2 6-2zm6 12c0 .5-2.13 2-6 2s-6-1.5-6-2v-2.23c1.61.78 3.72 1.23 6 1.23s4.39-.45 6-1.23V17zm0-5c0 .5-2.13 2-6 2s-6-1.5-6-2V9.77c1.61.78 3.72 1.23 6 1.23s4.39-.45 6-1.23V12z"/></svg>
    <text x="38" y="22" class="label">Azure MySQL</text>
    <text x="38" y="34" class="sublabel">KPAS Database</text>
  </g>

</svg>