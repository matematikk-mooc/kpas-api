<svg xmlns="http://www.w3.org/2000/svg" width="1156" height="232" viewBox="0 0 1156 232">
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #1E293B; }
      .sublabel { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 500; fill: #64748B; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; rx: 6px; }
      .card-disabled { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1.5; stroke-dasharray: 4,4; rx: 6px; }
      .label-disabled { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #94A3B8; }
      .sublabel-disabled { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 500; fill: #94A3B8; }
      .edge { stroke: #0078D4; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .edge-dot { stroke: #64748B; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .edge-disabled { stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { fill: #0078D4; }
      .arrow-dot { fill: #64748B; }
      .arrow-disabled { fill: #CBD5E1; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" class="arrow" />
    </marker>
    <marker id="arr-dot" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" class="arrow-dot" />
    </marker>
    <marker id="arr-disabled" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" class="arrow-disabled" />
    </marker>
  </defs>

  <!-- Pure White Background -->
  <rect width="1156" height="232" fill="#FFFFFF"/>

  <!-- ==================== CONNECTORS ==================== -->

  <!-- User -> Canvas -->
  <path d="M 114 116 L 138 116" class="edge" marker-end="url(#arr)"/>

  <!-- Canvas -> KPAS LTI Tools -->
  <path d="M 302 116 L 326 116" class="edge" marker-end="url(#arr)"/>

  <!-- KPAS LTI Tools -> KPAS Services -->
  <path d="M 510 116 L 534 116" class="edge" marker-end="url(#arr)"/>

  <!-- KPAS Services -> Statistics API -->
  <path d="M 718 116 L 742 116" class="edge" marker-end="url(#arr)"/>

  <!-- Statistics API -> Grafana (/api/ping) -->
  <path d="M 848 94 L 848 78" class="edge-dot" marker-end="url(#arr-dot)"/>

  <!-- Statistics API -> Sentry (Disabled) -->
  <path d="M 848 138 L 848 154" class="edge-disabled" marker-end="url(#arr-disabled)"/>

  <!-- Statistics API -> Canvas API (Row 1) -->
  <path d="M 954 100 L 974 100 L 974 26 L 1000 26" class="edge" marker-end="url(#arr)"/>

  <!-- Statistics API -> Azure MySQL (Row 2) -->
  <path d="M 954 110 L 980 110 L 980 86 L 1000 86" class="edge" marker-end="url(#arr)"/>

  <!-- Statistics API -> Matomo API (Row 3) -->
  <path d="M 954 122 L 980 122 L 980 146 L 1000 146" class="edge" marker-end="url(#arr)"/>

  <!-- Statistics API -> KPAS NSR (Row 4) -->
  <path d="M 954 132 L 974 132 L 974 206 L 1000 206" class="edge-dot" marker-end="url(#arr-dot)"/>

  <!-- ==================== COMPONENTS ==================== -->

  <!-- 1. User -->
  <g transform="translate(4, 94)">
    <rect width="110" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#475569" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    <text x="38" y="22" class="label">User</text>
    <text x="38" y="34" class="sublabel">Browser</text>
  </g>

  <!-- 2. Canvas -->
  <g transform="translate(138, 94)">
    <rect width="164" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#E11D48" d="M12 2L1 21h22L12 2zm0 3.8L19.5 19h-15L12 5.8z"/></svg>
    <text x="38" y="22" class="label">Canvas</text>
    <text x="38" y="34" class="sublabel">bibsys.instructure.com</text>
  </g>

  <!-- 3. KPAS LTI Tools -->
  <g transform="translate(326, 94)">
    <rect width="184" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#F59E0B" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
    <text x="38" y="22" class="label">KPAS LTI Tools</text>
    <text x="38" y="34" class="sublabel">Forvaltning &amp; Statistikk</text>
  </g>

  <!-- 4. KPAS Services -->
  <g transform="translate(534, 94)">
    <rect width="184" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#F59E0B" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
    <text x="38" y="22" class="label">KPAS Services</text>
    <text x="38" y="34" class="sublabel">Module, History &amp; Matomo</text>
  </g>

  <!-- 5a. Grafana -->
  <g transform="translate(742, 34)">
    <rect width="212" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#F46800" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
    <text x="38" y="22" class="label">Grafana</text>
    <text x="38" y="34" class="sublabel">/api/ping → Slack Alert</text>
  </g>

  <!-- 5b. Statistics API -->
  <g transform="translate(742, 94)">
    <rect width="212" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#10B981" d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
    <text x="38" y="22" class="label">Statistics API</text>
    <text x="38" y="34" class="sublabel">statistics-api.azurewebsites.net</text>
  </g>

  <!-- 5c. Sentry -->
  <g transform="translate(742, 154)">
    <rect width="212" height="44" class="card-disabled"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#94A3B8" d="M13.91 2.5a2.2 2.2 0 0 0-3.82 0L1.29 17.75a2.2 2.2 0 0 0 1.91 3.3h3.92v-2.1h-3.9a.1.1 0 0 1-.09-.15L11.9 3.55a.1.1 0 0 1 .18 0l8.78 15.25a.1.1 0 0 1-.09.15h-2.55a10.4 10.4 0 0 0-9.15-9.55v2.12a8.3 8.3 0 0 1 7 8.23v1.3h4.71a2.2 2.2 0 0 0 1.91-3.3L13.91 2.5zm-4.79 11.6a6.2 6.2 0 0 1 5.08 6.1v.85h-2.1v-.85a4.1 4.1 0 0 0-2.98-3.95v-2.15z"/></svg>
    <text x="38" y="22" class="label-disabled">Sentry</text>
    <text x="38" y="34" class="sublabel-disabled">Disabled</text>
  </g>

  <!-- 6a. Canvas API -->
  <g transform="translate(1000, 4)">
    <rect width="152" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#E11D48" d="M12 2L1 21h22L12 2zm0 3.8L19.5 19h-15L12 5.8z"/></svg>
    <text x="38" y="22" class="label">Canvas API</text>
    <text x="38" y="34" class="sublabel">REST &amp; GraphQL</text>
  </g>

  <!-- 6b. Azure MySQL -->
  <g transform="translate(1000, 64)">
    <rect width="152" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#0078D4" d="M12 3C7.58 3 4 4.79 4 7v10c0 2.21 3.59 4 8 4s8-1.79 8-4V7c0-2.21-3.58-4-8-4zm0 2c3.87 0 6 1.5 6 2s-2.13 2-6 2-6-1.5-6-2 2.13-2 6-2zm6 12c0 .5-2.13 2-6 2s-6-1.5-6-2v-2.23c1.61.78 3.72 1.23 6 1.23s4.39-.45 6-1.23V17zm0-5c0 .5-2.13 2-6 2s-6-1.5-6-2V9.77c1.61.78 3.72 1.23 6 1.23s4.39-.45 6-1.23V12z"/></svg>
    <text x="38" y="22" class="label">Azure MySQL</text>
    <text x="38" y="34" class="sublabel">Stats Database</text>
  </g>

  <!-- 6c. Matomo API -->
  <g transform="translate(1000, 124)">
    <rect width="152" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#0284C7" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
    <text x="38" y="22" class="label">Matomo API</text>
    <text x="38" y="34" class="sublabel">statistik.digilaer.no</text>
  </g>

  <!-- 6d. KPAS NSR -->
  <g transform="translate(1000, 184)">
    <rect width="152" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#F59E0B" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
    <text x="38" y="22" class="label">KPAS</text>
    <text x="38" y="34" class="sublabel">/api/nsr/*</text>
  </g>

</svg>
