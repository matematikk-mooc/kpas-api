<svg xmlns="http://www.w3.org/2000/svg" width="660" height="292" viewBox="0 0 660 292">
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #1E293B; }
      .sublabel { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 500; fill: #64748B; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; rx: 6px; }
      .edge { stroke: #0078D4; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { fill: #0078D4; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" class="arrow" />
    </marker>
  </defs>

  <!-- Pure White Background -->
  <rect width="660" height="292" fill="#FFFFFF"/>

  <!-- ==================== CONNECTORS ==================== -->

  <!-- Monitored Sources -> Merged Bus -> Grafana Stack -->
  <path d="M 188 26 L 208 26 L 208 266 L 188 266" class="edge"/>
  <path d="M 188 86 L 208 86" class="edge"/>
  <path d="M 188 146 L 228 146" class="edge" marker-end="url(#arr)"/>
  <path d="M 188 206 L 208 206" class="edge"/>

  <!-- Grafana Stack -> Merged Split -> Outputs -->
  <path d="M 432 146 L 452 146" class="edge"/>
  <path d="M 452 116 L 472 116" class="edge" marker-end="url(#arr)"/>
  <path d="M 452 116 L 452 176 L 472 176" class="edge" marker-end="url(#arr)"/>

  <!-- ==================== COMPONENTS ==================== -->

  <!-- 1a. Blackbox Probes -->
  <g transform="translate(4, 4)">
    <rect width="184" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#10B981" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
    <text x="38" y="22" class="label">Blackbox Probes</text>
    <text x="38" y="34" class="sublabel">HTTP &amp; SSL Expiry</text>
  </g>

  <!-- 1b. Ping Endpoints -->
  <g transform="translate(4, 64)">
    <rect width="184" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#F59E0B" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
    <text x="38" y="22" class="label">Ping Endpoints</text>
    <text x="38" y="34" class="sublabel">Core &amp; Integrations</text>
  </g>

  <!-- 1c. KPAS MySQL -->
  <g transform="translate(4, 124)">
    <rect width="184" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#0078D4" d="M12 3C7.58 3 4 4.79 4 7v10c0 2.21 3.59 4 8 4s8-1.79 8-4V7c0-2.21-3.58-4-8-4zm0 2c3.87 0 6 1.5 6 2s-2.13 2-6 2-6-1.5-6-2 2.13-2 6-2zm6 12c0 .5-2.13 2-6 2s-6-1.5-6-2v-2.23c1.61.78 3.72 1.23 6 1.23s4.39-.45 6-1.23V17zm0-5c0 .5-2.13 2-6 2s-6-1.5-6-2V9.77c1.61.78 3.72 1.23 6 1.23s4.39-.45 6-1.23V12z"/></svg>
    <text x="38" y="22" class="label">KPAS MySQL</text>
    <text x="38" y="34" class="sublabel">User Deletions</text>
  </g>

  <!-- 1d. Reminders Sheet -->
  <g transform="translate(4, 184)">
    <rect width="184" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#107C41" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14h-2l-2-3.5L8 17H6l3-5-3-5h2l2 3.5L12 7h2l-3 5 3 5z"/></svg>
    <text x="38" y="22" class="label">Reminders Sheet</text>
    <text x="38" y="34" class="sublabel">Excel Countdown</text>
  </g>

  <!-- 1e. Digilær MSSQL -->
  <g transform="translate(4, 244)">
    <rect width="184" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#0284C7" d="M12 3C7.58 3 4 4.79 4 7v10c0 2.21 3.59 4 8 4s8-1.79 8-4V7c0-2.21-3.58-4-8-4zm0 2c3.87 0 6 1.5 6 2s-2.13 2-6 2-6-1.5-6-2 2.13-2 6-2zm6 12c0 .5-2.13 2-6 2s-6-1.5-6-2v-2.23c1.61.78 3.72 1.23 6 1.23s4.39-.45 6-1.23V17zm0-5c0 .5-2.13 2-6 2s-6-1.5-6-2V9.77c1.61.78 3.72 1.23 6 1.23s4.39-.45 6-1.23V12z"/></svg>
    <text x="38" y="22" class="label">Digilær MSSQL</text>
    <text x="38" y="34" class="sublabel">Playwright Status</text>
  </g>

  <!-- 2. Grafana Stack -->
  <g transform="translate(228, 124)">
    <rect width="204" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#F46800" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
    <text x="38" y="22" class="label">Grafana Stack</text>
    <text x="38" y="34" class="sublabel">Nginx, Prometheus &amp; Grafana</text>
  </g>

  <!-- 3a. Udir Office Kiosk -->
  <g transform="translate(472, 94)">
    <rect width="184" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#475569" d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
    <text x="38" y="22" class="label">Udir Office Kiosk</text>
    <text x="38" y="34" class="sublabel">TV Playlist: 60s</text>
  </g>

  <!-- 3b. Slack Alerts -->
  <g transform="translate(472, 154)">
    <rect width="184" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#E11D48" d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
    <text x="38" y="22" class="label">Slack Alerts</text>
    <text x="38" y="34" class="sublabel">24/7 Health &amp; Work Hours</text>
  </g>

</svg>
