<svg xmlns="http://www.w3.org/2000/svg" width="896" height="116" viewBox="0 0 896 116">
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #1E293B; }
      .sublabel { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 500; fill: #64748B; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; rx: 6px; }
      .edge { stroke: #0078D4; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { fill: #0078D4; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" class="arrow" />
    </marker>
  </defs>

  <!-- Pure White Background -->
  <rect width="896" height="116" fill="#FFFFFF"/>

  <!-- ==================== CONNECTORS ==================== -->

  <!-- Git Push -> build-docker.yml -->
  <path d="M 136 58 L 160 58" class="edge" marker-end="url(#arr)"/>

  <!-- build-docker.yml -> Container Registry -->
  <path d="M 324 58 L 348 58" class="edge" marker-end="url(#arr)"/>

  <!-- Container Registry -> deploy-app.yml -->
  <path d="M 516 58 L 540 58" class="edge" marker-end="url(#arr)"/>

  <!-- deploy-app.yml -> Azure App Service -->
  <path d="M 696 58 L 720 58" class="edge" marker-end="url(#arr)"/>

  <!-- ==================== COMPONENTS ==================== -->

  <!-- 1. Git Push -->
  <g transform="translate(4, 36)">
    <rect width="132" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#F05032" d="M23.546 10.93L13.067.452a1.5 1.5 0 0 0-2.126 0L8.808 2.585l3.256 3.256a1.781 1.781 0 0 1 2.25 2.25l3.14 3.14a1.78 1.78 0 1 1-1.066 1.066l-2.932-2.932v4.868a1.78 1.78 0 1 1-1.5 0v-5.02a1.78 1.78 0 0 1-.954-2.336L7.75 3.644.452 10.942a1.5 1.5 0 0 0 0 2.126l10.48 10.48a1.5 1.5 0 0 0 2.125 0l10.489-10.49a1.5 1.5 0 0 0 0-2.127z"/></svg>
    <text x="38" y="22" class="label">Git Push</text>
    <text x="38" y="34" class="sublabel">stage or main</text>
  </g>

  <!-- 2. build-docker.yml -->
  <g transform="translate(160, 36)">
    <rect width="164" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#2088FF" d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/></svg>
    <text x="38" y="22" class="label">build-docker.yml</text>
    <text x="38" y="34" class="sublabel">Docker Build &amp; Push</text>
  </g>

  <!-- 3. Container Registry -->
  <g transform="translate(348, 36)">
    <rect width="168" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#0078D4" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
    <text x="38" y="22" class="label">Container Registry</text>
    <text x="38" y="34" class="sublabel">Image: CI-&lt;sha&gt;</text>
  </g>

  <!-- 4. deploy-app.yml -->
  <g transform="translate(540, 36)">
    <rect width="156" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#2088FF" d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/></svg>
    <text x="38" y="22" class="label">deploy-app.yml</text>
    <text x="38" y="34" class="sublabel">Set Image &amp; Restart</text>
  </g>

  <!-- 5. Azure App Service -->
  <g transform="translate(720, 36)">
    <rect width="172" height="44" class="card"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24"><path fill="#0078D4" d="M12 2L2 7l10 5 10-5-10-5zm0 7.5l-6-3 6-3 6 3-6 3zm0 2.5l-10-5v2l10 5 10-5v-2l-10 5zm0 5l-10-5v2l10 5 10-5v-2l-10 5z"/></svg>
    <text x="38" y="22" class="label">Azure App Service</text>
    <text x="38" y="34" class="sublabel">kpas-staging / kpas-prod</text>
  </g>

</svg>